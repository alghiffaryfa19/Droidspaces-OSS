name: Droidspaces CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create an Official GitHub Release?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Tag name (Only used if Release is checked)'
        required: false
        default: 'test'

jobs:
  build:
    name: Build Backend & Android App
    runs-on: ubuntu-latest
    env:
      HAS_TELEGRAM: ${{ secrets.API_ID != '' && secrets.API_HASH != '' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential wget tree zstd

    - name: Download Toolchains
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains
        BASE_URL="https://github.com/ravindu644/Droidspaces-OSS/releases/download/compilers-25843896720"

        echo "[*] Downloading aarch64 toolchain..."
        wget -q $BASE_URL/aarch64-linux-musl-cross.tar.zst

        echo "[*] Downloading armhf toolchain..."
        wget -q $BASE_URL/arm-linux-musleabihf-cross.tar.zst

        echo "[*] Downloading x86 toolchain..."
        wget -q $BASE_URL/i686-linux-musl-cross.tar.zst

        echo "[*] Downloading x86_64 toolchain..."
        wget -q $BASE_URL/x86_64-linux-musl-cross.tar.zst

        echo "[*] Downloading riscv64 toolchain..."
        wget -q $BASE_URL/riscv64-linux-musl-cross.tar.zst

        echo "[*] Extracting toolchains..."
        for f in *.tar.zst; do
          echo "Extracting $f..."
          tar -xf "$f"
        done

        echo "[+] Toolchains ready."
        tree -L 3 $HOME/toolchains

        # Download and extract libsystemd for arm64 from Ubuntu Ports
        SYS_URL="http://ports.ubuntu.com/pool/main/s/systemd/"
        SYS_DEV=$(curl -s $SYS_URL | grep -o 'libsystemd-dev_[^"]*_arm64\.deb' | sort -V | tail -n 1)
        SYS_LIB=$(curl -s $SYS_URL | grep -o 'libsystemd0_[^"]*_arm64\.deb' | sort -V | tail -n 1)
        wget -q -O sys-dev.deb "$SYS_URL$SYS_DEV"
        wget -q -O sys-lib.deb "$SYS_URL$SYS_LIB"
        dpkg -x sys-dev.deb ubuntu-deps
        dpkg -x sys-lib.deb ubuntu-deps
        
        # Download and extract libdrm for arm64 from Ubuntu Ports
        DRM_URL="http://ports.ubuntu.com/pool/main/libd/libdrm/"
        DRM_DEV=$(curl -s $DRM_URL | grep -o 'libdrm-dev_[^"]*_arm64\.deb' | sort -V | tail -n 1)
        DRM_LIB=$(curl -s $DRM_URL | grep -o 'libdrm2_[^"]*_arm64\.deb' | sort -V | tail -n 1)
        wget -q -O drm-dev.deb "$DRM_URL$DRM_DEV"
        wget -q -O drm-lib.deb "$DRM_URL$DRM_LIB"
        dpkg -x drm-dev.deb ubuntu-deps
        dpkg -x drm-lib.deb ubuntu-deps
            
        # Download and extract libhybris from UBPorts
        HYB_URL="http://repo.ubports.com/pool/main/libh/libhybris/"
        HYB_DEV=$(curl -s $HYB_URL | grep -o 'libhybris-dev_[^"]*_arm64\.deb' | head -n 1)
        HYB_LIB=$(curl -s $HYB_URL | grep -o 'libhybris_[0-9][^"]*_arm64\.deb' | head -n 1)
        wget -q -O hyb-dev.deb "$HYB_URL$HYB_DEV"
        wget -q -O hyb-lib.deb "$HYB_URL$HYB_LIB"
        dpkg -x hyb-dev.deb ubports-deps
        dpkg -x hyb-lib.deb ubports-deps
        
        # Fix absolute symlinks and create missing .so symlinks
        for depdir in ubuntu-deps ubports-deps; do
            for link in $(find $depdir -type l -name "*.so"); do
                target=$(readlink "$link")
                if [[ "$target" == /* ]]; then
                    ln -sf "$(basename "$target")" "$link"
                fi
            done
            for lib in $(find $depdir -type f -name "*.so.*"); do
                base_so="${lib%%.so.*}.so"
                if [ ! -e "$base_so" ]; then
                    ln -sf "$(basename "$lib")" "$base_so"
                fi
            done
        done
        
        # Fix pkg-config prefix paths for cross-compilation
        find ubuntu-deps -name "*.pc" -exec sed -i "s|^prefix=.*|prefix=$(pwd)/ubuntu-deps/usr|g" {} +
        find ubports-deps -name "*.pc" -exec sed -i "s|^prefix=.*|prefix=$(pwd)/ubports-deps/usr|g" {} +
        
        # Clone Android headers (required by libhybris)
        git clone --depth 1 -b halium-11.0 https://github.com/Halium/android-headers.git
        
        # Clone libhybris source (for missing internal headers like windowbuffer.h)
        git clone --depth 1 https://github.com/Linux-on-droid/libhybris.git
        
        # Set pkg-config path to point to the extracted libraries
        export PKG_CONFIG_PATH="$(pwd)/ubuntu-deps/usr/lib/aarch64-linux-gnu/pkgconfig:$(pwd)/ubports-deps/usr/lib/aarch64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH"
        export CFLAGS="-I$(pwd)/libhybris/hybris/include -I$(pwd)/libhybris -I$(pwd)/ubuntu-deps/usr/include -I$(pwd)/ubuntu-deps/usr/include/aarch64-linux-gnu -I$(pwd)/ubuntu-deps/usr/include/libdrm -I$(pwd)/ubports-deps/usr/include -I$(pwd)/android-headers"
        export LDFLAGS="-L$(pwd)/ubuntu-deps/lib/aarch64-linux-gnu -L$(pwd)/ubuntu-deps/usr/lib/aarch64-linux-gnu -L$(pwd)/ubports-deps/usr/lib/aarch64-linux-gnu -L$(pwd)/ubports-deps/lib/aarch64-linux-gnu"
        
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        
        git clone https://github.com/Linux-on-droid/create-disp.git
        cd create-disp
        mkdir -p build
        cmake -B build \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_C_FLAGS="$CFLAGS" \
          -DCMAKE_CXX_FLAGS="$CFLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
          -G Ninja
        cmake --build build
        mkdir -p ../Android/app/src/main/assets/binaries
        cp build/create-disp ../Android/app/src/main/assets/binaries/ || echo "Warning: create-disp binary not found after build."

    - name: Build All Tarball, Debian Packages & Sync to Android
      run: |
        make all-tarball
        scripts/mkdeb.sh

    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      if: "${{ env.RELEASE_KEYSTORE != '' }}"
      run: echo "${{ env.RELEASE_KEYSTORE }}" | base64 -d > droidspaces.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x Android/gradlew

    - name: Generate Contributors
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pip install -q requests
        python3 scripts/generate_contributors.py

    - name: Build Android App with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd Android
        ./gradlew assembleRelease \
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

    - name: Stage & Rename Artifacts
      run: |
        TAG="${{ github.event.inputs.tag_name || 'CI' }}"
        COMMIT_HASH=$(git log -1 --pretty=%h)
        APK_NAME="Droidspaces-universal-${TAG}-${COMMIT_HASH}.apk"
        TAR_NAME=$(ls droidspaces-v*-*.tar.gz)
        mkdir -p dist
        mv Android/app/build/outputs/apk/release/app-release.apk dist/${APK_NAME}
        mv ${TAR_NAME} dist/
        mv droidspaces_*.deb dist/
        echo "APK_FILE=dist/${APK_NAME}" >> $GITHUB_ENV
        echo "TAR_FILE=dist/${TAR_NAME}" >> $GITHUB_ENV

    - name: Generate Telegram Message
      if: github.event_name != 'pull_request'
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ github.event.inputs.create_release }}" = "true" ]; then
            EVENT_TYPE="Official Release"
          else
            EVENT_TYPE="Manual Trigger"
          fi
        else
          EVENT_TYPE="Git Push"
        fi
        COMMIT_MSG=$(git log -1 --pretty=format:%s)
        COMMIT_SHA=$(git log -1 --pretty=format:%h)
        COMMIT_AUTHOR=$(git log -1 --pretty=format:%an)
        {
          echo "TELEGRAM_MESSAGE<<EOF"
          echo "**Droidspaces Build Successful**"
          echo ""
          echo "**Repository:** [${{ github.repository }}](https://github.com/${{ github.repository }})"
          echo "**Branch:** ${{ github.ref_name }}"
          echo "**Author:** $COMMIT_AUTHOR"
          echo "**Event:** $EVENT_TYPE"
          echo "**Commit SHA:** [$COMMIT_SHA](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
          echo ""
          echo "**Commit Message:**"
          echo ""
          echo "\`\`\`"
          echo "$COMMIT_MSG"
          echo "\`\`\`"
          echo "EOF"
        } >> "$GITHUB_ENV"

    - name: Upload Final Artifacts (APK, Tarball & Debian Packages)
      uses: actions/upload-artifact@v4
      with:
        name: droidspaces-artifacts
        path: dist/

    - name: Send Telegram Notification
      if: |
        github.event_name != 'pull_request' &&
        env.HAS_TELEGRAM == 'true'
      uses: xz-dev/TelegramFileUploader@v1
      with:
        to-who: ${{ secrets.TELEGRAM_TO }}
        message: ${{ env.TELEGRAM_MESSAGE }}
        files: |
          ${{ env.APK_FILE }}
          ${{ env.TAR_FILE }}
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: [build]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.create_release == 'true' &&
      github.event.inputs.tag_name != '' &&
      github.event.inputs.tag_name != 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Generate Changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "Previous tag: $PREV_TAG"

        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --oneline --pretty=format:"* %s (%h)")
        else
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --pretty=format:"* %s (%h)")
        fi

        {
          echo "notes<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: Droidspaces ${{ github.event.inputs.tag_name || 'Development Build' }}
        target_commitish: ${{ github.sha }}
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.notes }}

          ---
          **Automated Release by Droidspaces CI**
        files: |
          release-assets/*.apk
          release-assets/*.tar.gz
          release-assets/*.deb
